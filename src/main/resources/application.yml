server:
  port: 8080

spring:
  application:
    name: github-repo-service
  webflux:
    base-path: /

github:
  api:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN:}
    per-page: 100
    branch-fetch-concurrency: 8

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.takamol.githubrepo: INFO
